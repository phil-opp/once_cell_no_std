[package]
name = "once_cell_no_std"
version = "0.1.1"
authors = [
    "Aleksey Kladov <aleksey.kladov@gmail.com>",
    "Philipp Oppermann <dev@phil-opp.com>",
]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.85"

description = "Sync single assignment cells for `no_std`"
readme = "README.md"
documentation = "https://docs.rs/once_cell_no_std"

repository = "https://github.com/phil-opp/once_cell_no_std"
keywords = ["no_std", "static", "once", "cell", "sync"]
categories = ["no-std", "rust-patterns", "embedded", "concurrency"]

exclude = ["/.github", "/.devcontainer", "/ci", "/rustfmt.toml"]

[dev-dependencies]
regex = "1.10.6"

# `loom` replaces the atomics and the `UnsafeCell` in `imp` to exhaustively explore thread
# interleavings. It is only pulled in under `--cfg loom`; see `tests/loom_model.rs`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(loom)', 'cfg(no_panic_check)'] }

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]
